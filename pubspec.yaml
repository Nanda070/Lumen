name: lumen
description: Local life OS by Nanda / Cheterin Group — calendar, finance, and rooms for the rest of life.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  phosphor_icons: ^3.0.1
  google_fonts: ^8.2.1
  drift: ^2.32.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  dashboard: ^0.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.10.4

flutter:
  generate: true
  uses-material-design: true
